# Dedicated, database-only Supabase project for manual integration tests.
# It deliberately uses ports separate from the developer project in
# supabase/config.toml and is never started by the regular test suite or CI.
project_id = "hub-integration"

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false
