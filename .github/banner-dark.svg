<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Highlights Hub — your KOReader highlights, unified and in Obsidian">
  <rect width="1200" height="320" fill="#211f1c"/>

  <!-- Bookmark mark, scaled from the 40x40 icon in the design system -->
  <g transform="translate(72 118) scale(2.1)">
    <rect x="1" y="1" width="38" height="38" rx="9" fill="#2a2723" stroke="#464137" stroke-width="1"/>
    <path d="M13 11 L13 29 L20 25.5 L27 29 L27 11 Z" fill="none" stroke="#e0885f" stroke-width="2" stroke-linejoin="round"/>
    <line x1="16" y1="16" x2="24" y2="16" stroke="#e0885f" stroke-width="1.5"/>
    <line x1="16" y1="19.5" x2="24" y2="19.5" stroke="#e0885f" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" fill="#f1efe9" letter-spacing="-0.8">Highlights Hub</text>
  <text x="180" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#a7a196">Your KOReader highlights, unified and in Obsidian.</text>

  <!-- Source → destination, in the app's own mono voice -->
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#a7a196">
    <text x="180" y="220">metadata.lua</text>
    <text x="302" y="220" fill="#e0885f">&#8594;</text>
    <text x="328" y="220">dashboard</text>
    <text x="432" y="220" fill="#e0885f">&#8594;</text>
    <text x="458" y="220">book.md</text>
  </g>

  <!-- A highlight card: the product's signature element, accent rule and all -->
  <g transform="translate(700 76)">
    <rect x="0" y="0" width="428" height="168" rx="12" fill="#2a2723" stroke="#464137" stroke-width="1"/>
    <rect x="0" y="0" width="3" height="168" rx="1.5" fill="#e0885f"/>
    <text x="28" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-style="italic" fill="#f1efe9">The land knows you, even when you</text>
    <text x="28" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-style="italic" fill="#f1efe9">are lost.</text>
    <line x1="28" y1="108" x2="400" y2="108" stroke="#464137" stroke-width="1"/>
    <text x="28" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#a7a196">CH. 4 &#183; LOC. 412 &#183; KOREADER</text>
  </g>
</svg>
